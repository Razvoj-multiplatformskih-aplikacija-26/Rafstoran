name: rafstoran_workspace
description: Rafstoran, one system in one language. The workspace resolves every app and package together.
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - apps/mobile
  - apps/backoffice
  - packages/domain
  - packages/use_cases
  - packages/blocs
  - packages/ui
  - packages/design_tokens
  - packages/api_contract

dev_dependencies:
  flutter_lints: 6.0.0
