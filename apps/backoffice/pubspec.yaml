name: backoffice
description: Rafstoran staff backoffice for the daily schedule of tables and reservations.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  api_client:
    path: ../../packages/api_client
  api_contract:
    path: ../../packages/api_contract
  api_mapping:
    path: ../../packages/api_mapping
  blocs:
    path: ../../packages/blocs
  design_tokens:
    path: ../../packages/design_tokens
  domain:
    path: ../../packages/domain
  drift: 2.34.4
  drift_flutter: 0.3.1
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  flutter_web_plugins:
    sdk: flutter
  go_router: 18.0.2
  intl: 0.20.3
  path_provider: 2.1.6
  two_dimensional_scrollables: 0.5.5
  ui:
    path: ../../packages/ui
  use_cases:
    path: ../../packages/use_cases

dev_dependencies:
  build_runner: 2.15.1
  drift_dev: 2.34.0
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
