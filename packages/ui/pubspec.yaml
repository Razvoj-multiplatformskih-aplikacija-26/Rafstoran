name: ui
description: Rafstoran theme, fonts and shared widgets for the Flutter clients.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  design_tokens:
    path: ../design_tokens
  domain:
    path: ../domain
  flutter:
    sdk: flutter
  intl: 0.20.3

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/raf_mark.png
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/fraunces/Fraunces72pt-Regular.ttf
        - asset: assets/fonts/fraunces/Fraunces72pt-Italic.ttf
          style: italic
        - asset: assets/fonts/fraunces/Fraunces72pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/fraunces/Fraunces72pt-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/fraunces/Fraunces72pt-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
